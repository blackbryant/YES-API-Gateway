# 模擬環境：.NET 閘道 + 測試後端 backend-a / backend-b（+ 閘道必需的 PostgreSQL）
# 使用方式見 simulation/README.md；於 repo 根目錄執行：
#   .\simulation\scripts\build-frontend.ps1                      # 先把管理介面打包進 wwwroot
#   docker compose -f simulation/docker-compose.yml up -d --build
#
# 對外網址：http://api.example.local:8080（本機 hosts 需有 127.0.0.1 api.example.local）
# 測試後端各自是一台主機，以固定 IP 當主機位址：http://172.31.0.11:9001、http://172.31.0.12:9002（不能填 localhost）
# 網段若與公司 VPN / 內網衝突，修改下方 subnet 與各 ipv4_address 即可。

name: yes-gw-sim

networks:
  sim:
    ipam:
      config: [{ subnet: 172.31.0.0/24 }]

volumes:
  pgdata: {}

x-rest-backend: &rest-backend
  image: node:22.12.0-alpine
  command: ["node", "/app/server.js"]
  volumes: ["./rest-backend:/app:ro"]
  restart: unless-stopped

services:
  # ---- 資料庫：閘道必需；POSTGRES_USER / PASSWORD / DB 與閘道共用同一份 .env ----
  postgres:
    image: postgres:17-alpine
    env_file: .env
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]   # 供本機 dotnet run / 整合測試連線
    volumes: [pgdata:/var/lib/postgresql/data]
    networks:
      sim: { ipv4_address: 172.31.0.5 }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- .NET 閘道（含管理介面 wwwroot/admin）----
  gateway:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    image: yes-api-gateway:sim
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-Development}
      Database__ApplyMigrationsOnStartup: "true"
      Gateway__NodeId: gw-1
      # 容器間固定連 postgres 的 5432；.env 的 POSTGRES_HOST_PORT 才是對本機開放的埠
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    networks:
      sim:
        ipv4_address: 172.31.0.10
        # 對外網域：容器內以此名稱連到閘道時，Host 標頭即為 api.example.local:8080
        aliases: [api.example.local]
    ports: ["${GATEWAY_PORT:-8080}:8080"]

  # ---- 測試後端：REST 測試服務（rest-backend/server.js）----
  # /items 支援 GET / POST / PUT / PATCH / DELETE 與查詢參數，其他路徑回顯請求；
  # 回應的 service 欄位為自己的名稱，用來判斷流量落在哪一組
  backend-a:
    <<: *rest-backend
    environment: { SERVICE_NAME: backend-a, PORT: "9001" }
    networks:
      sim: { ipv4_address: 172.31.0.11 }
    ports: ["9001:9001"]

  backend-b:
    <<: *rest-backend
    environment: { SERVICE_NAME: backend-b, PORT: "9002" }
    networks:
      sim: { ipv4_address: 172.31.0.12 }
    ports: ["9002:9002"]
